version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  dev:
    desc: Watch for changes and rebuild the library
    cmds:
      - npm run dev

  build:
    desc: Build the library (ES6 ESM)
    cmds:
      - npm run build

  test:
    desc: Run all command-line examples as tests and save output to test-output/
    cmds:
      - mkdir -p test-output
      - echo "Running all examples..."
      - npx tsx examples/rectangle.ts > test-output/rectangle.svg
      - npx tsx examples/rectangle2.ts > test-output/rectangle2.svg
      - npx tsx examples/circle.ts > test-output/circle.svg
      - npx tsx examples/ellipse.ts > test-output/ellipse.svg
      - npx tsx examples/line.ts > test-output/line.svg
      - npx tsx examples/polygon.ts > test-output/polygon.svg
      - npx tsx examples/dashed-rectangle.ts > test-output/dashed-rectangle.svg
      - npx tsx examples/dashed-line.ts > test-output/dashed-line.svg
      - npx tsx examples/dashed-polygon.ts > test-output/dashed-polygon.svg
      - npx tsx examples/dashed-ellipse.ts > test-output/dashed-ellipse.svg
      - npx tsx examples/barchart.ts > test-output/barchart.svg
      - npx tsx examples/piechart.ts > test-output/piechart.svg
      - npx tsx examples/piechart3d.ts > test-output/piechart3d.svg
      - npx tsx examples/piechart3d_advanced.ts > test-output/piechart3d_advanced.svg
      - npx tsx examples/ridgeplot.ts > test-output/ridgeplot.svg
      - npx tsx examples/multi-style-fill.ts > test-output/multi_style_fill.svg
      - npx tsx bin/generate-test-html.ts
      - echo "Tests completed. Visual dashboard created in test-output/index.html"

  lint:
    desc: Run ESLint
    cmds:
      - npm run lint

  clean:
    desc: Remove build artifacts and test output
    cmds:
      - rm -rf dist test-output
